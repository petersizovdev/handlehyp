<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>HandleHYP</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #0a0a0a;
        color: #e8e8e8;
        min-height: 100vh;
        max-width: 480px;
        margin: 0 auto;
        padding: 16px;
      }
      .app-header {
        text-align: center;
        padding: 20px 0;
        font-size: 24px;
        font-weight: 700;
        color: #fff;
        border-bottom: 1px solid #222;
        margin-bottom: 16px;
      }
      .signal-card {
        background: #141414;
        border: 1px solid #222;
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 12px;
        cursor: pointer;
        transition: border-color 0.2s;
      }
      .signal-card:hover, .signal-card.active {
        border-color: #3b82f6;
      }
      .signal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
      }
      .signal-name {
        font-size: 16px;
        font-weight: 600;
        color: #fff;
      }
      .signal-coin {
        font-size: 12px;
        background: #1e293b;
        padding: 2px 8px;
        border-radius: 4px;
        color: #94a3b8;
      }
      .signal-side {
        font-size: 14px;
        font-weight: 700;
        padding: 4px 12px;
        border-radius: 6px;
      }
      .signal-side.buy { background: #052e16; color: #22c55e; }
      .signal-side.sell { background: #450a0a; color: #ef4444; }
      .signal-confidence {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 8px;
        font-size: 13px;
        color: #94a3b8;
      }
      .conf-bar {
        flex: 1;
        height: 4px;
        background: #1e293b;
        border-radius: 2px;
        overflow: hidden;
      }
      .conf-fill {
        height: 100%;
        border-radius: 2px;
        background: #3b82f6;
      }
      .signal-detail {
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px solid #222;
      }
      .evidence-item {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        padding: 4px 0;
        color: #94a3b8;
      }
      .entry-price {
        font-size: 14px;
        color: #e8e8e8;
        margin-top: 8px;
      }
      .action-bar {
        display: flex;
        gap: 12px;
        margin-top: 24px;
        padding-top: 16px;
        border-top: 1px solid #222;
      }
      .btn {
        flex: 1;
        padding: 14px;
        border-radius: 10px;
        border: none;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        color: #fff;
      }
      .btn-buy { background: #166534; }
      .btn-sell { background: #7f1d1d; }
      .btn:disabled { opacity: 0.4; cursor: not-allowed; }
      .empty-state {
        text-align: center;
        padding: 60px 20px;
        color: #64748b;
        font-size: 14px;
      }
      .result-box {
        background: #141414;
        border: 1px solid #222;
        border-radius: 12px;
        padding: 16px;
        margin-top: 16px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
